name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify wheel has cfdialog.py
        run: |
          unzip -l dist/*.whl | grep -E "cfdialog.py" || (echo "missing cfdialog.py" && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cfdialog
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing: 不需要 token。
          # 首次发布前，在 PyPI → Account → Publishing 添加：
          #   owner: styisme
          #   repo: cfdialog
          #   workflow: publish.yml
          #   environment: pypi
          skip-existing: false
